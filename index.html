<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><title>English Chunk Trainer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:system-ui,-apple-system,sans-serif}.app{max-width:700px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:22px;font-weight:800}.sub,.small{font-size:13px;color:#697386;line-height:1.5}.nav,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.grid{grid-template-columns:1fr 1fr}.btn{border:0;border-radius:13px;padding:13px 8px;font-weight:750;background:#172033;color:white}.light{background:#e7ebf0;color:#172033}.card{background:white;border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:0 3px 15px #0001}.label{font-size:11px;color:#7a8494;font-weight:800;letter-spacing:.08em}.chunk{font-size:29px;font-weight:850;margin:8px 0 10px}.jp{font-size:17px;line-height:1.55}.ex{background:#f4f6f8;border-radius:12px;padding:13px;margin-top:15px;line-height:1.55}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;margin:8px 4px 0 0}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid #dce1e8;border-radius:12px;padding:13px;margin-top:8px}.ok{background:#ecfdf3;border-color:#16a34a}.ng{background:#fff1f2;border-color:#dc2626}.hidden{display:none}.progress{height:7px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar{height:100%;background:#2563eb}.row{padding:11px;border:1px solid #e3e7ec;border-radius:11px;margin:7px 0;background:#fff}
</style></head><body><main class="app">
<div class="top"><div><div class="title">English Chunk Trainer</div><div class="sub">すきま時間に「かたまり」で覚える</div></div><span class="pill" id="n"></span></div>
<div class="nav"><button class="btn" onclick="today()">今日</button><button class="btn light" onclick="quizStart()">テスト</button><button class="btn light" onclick="weak()">苦手</button></div><div class="nav"><button class="btn light" onclick="listenMenu()">リスニング</button><button class="btn light" onclick="status()">学習状況</button><button class="btn light" onclick="resetStats()">履歴リセット</button></div>
<section id="screen"></section></main>
<script>
const seed=[
["figure out","理解する・解決する","I need to figure out why this happened."],["come up with","考え出す・提案する","Can you come up with a solution by Friday?"],["look into","調べる・検討する","I'll look into the issue and get back to you."],["take into account","考慮に入れる","We need to take cost into account."],["keep in mind","覚えておく・念頭に置く","Please keep in mind that the deadline is tight."],["get back to","後で返事をする","Let me check and get back to you tomorrow."],["cut down on","減らす","We need to cut down on unnecessary meetings."],["be on the same page","認識が一致している","Let's make sure we're on the same page."],["go over","詳しく確認する・見直す","Let's go over the proposal together."],["end up ~ing","結局～することになる","We ended up changing the plan."],["address an issue","問題に対処する","We need to address this issue quickly."],["under the impression that","～だと思い込んでいる","I was under the impression that the meeting was at ten."],["make up for","埋め合わせる","We need to make up for lost time."],["cut back on","～を減らす","We're trying to cut back on travel expenses."],["work around","～を回避して対応する","We need to find a way to work around the limitation."],["take a step back","一歩引いて考える","Let's take a step back and look at the bigger picture."],["run into","問題に遭遇する","We ran into a problem during testing."],["stem from","～に起因する","The problem stems from a lack of communication."],["narrow down","絞り込む","Let's narrow down the options to three."],["come to terms with","～を受け入れる","We need to come to terms with the new reality."],["bring about","引き起こす・もたらす","The change brought about significant improvements."],["bear in mind","心に留めておく","Bear in mind that quality comes first."],["be looking to","～しようとしている・目指している","We're looking to expand into Asia."],["account for","説明する・占める","How do you account for the difference?"],["do away with","廃止する・なくす","We should do away with this outdated process."],["factor in","考慮する","We need to factor in the delivery time."],["have a lot going for it","多くの長所がある","This proposal has a lot going for it."],["keep up with","遅れずについていく","It's hard to keep up with all the changes."],["iron out","問題を解決して整える","We need to iron out a few details."],["sort out","整理する・解決する","I'll sort out the schedule."],
["follow up on","～について追加で確認する","I'll follow up on this tomorrow."],["reach out to","～に連絡を取る","I'll reach out to the supplier."],["point out","指摘する","I'd like to point out one issue."],["bring up","話題に出す","She brought up an important point."],["deal with","対処する・扱う","We need to deal with this carefully."],["rely on","頼る・依存する","We can't rely on one supplier."],["in terms of","～の点では","In terms of cost, this is better."],["in line with","～に沿って","This is in line with our policy."],["make sure","必ず確認する","Please make sure the file is attached."]
];
const templates=["keep everyone in the loop","get the most out of","take the lead on","be responsible for","be involved in","focus on","work on","deal with","prepare for","follow up with","check in with","move forward with","set up","carry out","come across","point to","result in","lead to","contribute to","provide an update on","meet the deadline","raise a concern about","have an impact on","make progress on","come to a decision","reach an agreement","take responsibility for","put together","break down","go through"];
const jp={"keep everyone in the loop":"関係者全員に情報共有する","get the most out of":"最大限に活用する","take the lead on":"～を主導する","be responsible for":"～を担当する","be involved in":"～に関わる","focus on":"～に集中する","work on":"～に取り組む","deal with":"～に対処する","prepare for":"～に備える","follow up with":"～に追加で連絡する","check in with":"～に状況確認する","move forward with":"～を進める","set up":"設定する・準備する","carry out":"実施する","come across":"偶然見つける・出会う","point to":"～を示す","result in":"～という結果になる","lead to":"～につながる","contribute to":"～に貢献する","provide an update on":"～について最新状況を伝える","meet the deadline":"締切に間に合わせる","raise a concern about":"～について懸念を示す","have an impact on":"～に影響を与える","make progress on":"～を進める","come to a decision":"決定に至る","reach an agreement":"合意に達する","take responsibility for":"～に責任を持つ","put together":"まとめる・作成する","break down":"分解する・詳しく説明する","go through":"確認する・詳しく見る"};
const C=seed.map((x,i)=>({id:i+1,p:x[0],m:x[1],e:x[2]}));
let id=C.length+1;for(const p of templates){for(let r=0;r<11;r++){C.push({id:id++,p,m:jp[p],e:(r%3===0?"We need to "+p+" this before the meeting.":r%3===1?"I will "+p+" and send you an update.":"Let's "+p+" this carefully.")});}}
const S=JSON.parse(localStorage.ect||'{"seen":{},"ok":{},"ng":{},"total":0,"correct":0}');
function save(){localStorage.ect=JSON.stringify(S)}function esc(x){return x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.getElementById("n").textContent=C.length+" chunks";
function today(){let now=Date.now();let a=[...C].filter(c=>!S.next[c.id]||S.next[c.id]<=now).sort((x,y)=>((S.ng[y.id]||0)*5+(S.seen[x.id]||0))-((S.ng[x.id]||0)*5+(S.seen[y.id]||0)));let pool=a.length?a:C;let c=pool[Math.floor(Math.random()*Math.min(30,pool.length))];S.seen[c.id]=(S.seen[c.id]||0)+1;S.next=S.next||{};S.next[c.id]=Date.now()+86400000;save();screen.innerHTML='<div class="card"><div class="label">TODAY’S CHUNK</div><div class="chunk">'+esc(c.p)+'</div><div class="jp">'+esc(c.m)+'</div><div class="ex"><div class="label">EXAMPLE</div>'+esc(c.e)+'<br><span class="small">例文を声に出さなくても、まず意味と形を目で覚える。</span></div><span class="pill">Business / Daily</span></div><div class="grid"><button class="btn light" onclick="listen('+c.id+')">🔊 聞く</button><button class="btn light" onclick="today()">次のチャンク →</button></div><div class="card"><div class="small">学習済み '+Object.keys(S.seen).length+' / '+C.length+'　｜　累計正答率 '+(S.total?Math.round(S.correct/S.total*100):0)+'%</div><div class="progress"><div class="bar" style="width:'+Math.min(100,Object.keys(S.seen).length/C.length*100)+'%"></div></div></div>'}
function quizStart(){let q=[...C].sort((a,b)=>((S.ng[b.id]||0)*5+(S.seen[a.id]||0))-((S.ng[a.id]||0)*5+(S.seen[b.id]||0))).slice(0,10);quiz={q,i:0,score:0};quizDraw()}
let quiz=null;
function quizDraw(){if(quiz.i>=quiz.q.length){screen.innerHTML='<div class="card"><div class="label">RESULT</div><div class="chunk">'+quiz.score+' / '+quiz.q.length+'</div><div class="jp">間違えたチャンクは次回以降、優先的に出題します。</div></div><button class="btn" style="width:100%" onclick="quizStart()">もう一度テスト</button>';quiz=null;return}let c=quiz.q[quiz.i],o=[c];while(o.length<4){let x=C[Math.floor(Math.random()*C.length)];if(!o.some(y=>y.id==x.id))o.push(x)}o.sort(()=>Math.random()-.5);screen.innerHTML='<div class="card"><div class="label">QUESTION '+(quiz.i+1)+' / '+quiz.q.length+'</div><div class="chunk">'+esc(c.p)+'</div><div class="small">意味として最も近いものは？</div>'+o.map(x=>'<button class="choice" onclick="answer('+c.id+','+x.id+',this)">'+esc(x.m)+'</button>').join('')+'</div>'}
function answer(cid,oid,b){if(b.dataset.done)return; b.dataset.done=1;let ok=cid==oid;S.next=S.next||{};S.total++;if(ok){S.correct++;S.ok[cid]=(S.ok[cid]||0)+1;S.next[cid]=Date.now()+Math.min(30,2+(S.ok[cid]||1))*86400000;b.classList.add("ok")}else{S.ng[cid]=(S.ng[cid]||0)+1;S.next[cid]=Date.now()+3600000;b.classList.add("ng");document.querySelectorAll(".choice").forEach(x=>{if(x.textContent==C.find(z=>z.id==cid).m)x.classList.add("ok")})}save();setTimeout(()=>{quiz.score+=ok;quiz.i++;quizDraw()},600)}
function weak(){let a=C.filter(c=>S.ng[c.id]).sort((x,y)=>(S.ng[y.id]||0)-(S.ng[x.id]||0)).slice(0,20);screen.innerHTML='<div class="card"><div class="label">WEAK CHUNKS</div><div class="small">テストで間違えたものを優先表示。</div></div>'+(a.length?a.map(c=>'<div class="row"><b>'+esc(c.p)+'</b><br><span class="small">'+esc(c.m)+' ｜ ミス '+S.ng[c.id]+'回</span></div>').join(""):'<div class="card small">まだテスト履歴がありません。</div>')}
function listenMenu(){let c=C[Math.floor(Math.random()*C.length)];screen.innerHTML='<div class="card"><div class="label">LISTENING</div><div class="chunk">'+esc(c.p)+'</div><div class="jp">'+esc(c.m)+'</div><button class="btn" style="width:100%;margin-top:12px" onclick="listen('+c.id+')">🔊 再生</button><div class="small" style="margin-top:12px">音声は自動再生しません。聞きたいときだけ押してください。</div></div><button class="btn light" style="width:100%" onclick="listenMenu()">別のチャンク</button>'}
function status(){let seen=Object.keys(S.seen||{}).length, mastered=C.filter(c=>(S.ok[c.id]||0)>=3&&(S.ng[c.id]||0)===0).length;screen.innerHTML='<div class="card"><div class="label">LEARNING STATUS</div><div class="chunk">'+seen+' / '+C.length+'</div><div class="jp">学習したチャンク</div><div class="ex">テスト回答数：'+S.total+'<br>正答率：'+(S.total?Math.round(S.correct/S.total*100):0)+'%<br>3回以上正解・ミスなし：'+mastered+'<br>苦手チャンク：'+C.filter(c=>S.ng[c.id]).length+'</div></div><div class="card small">「今日」は未学習→苦手→復習期限が来たチャンクを優先します。</div>'}
function resetStats(){if(confirm("学習履歴をリセットしますか？")){localStorage.removeItem("ect");location.reload()}}
function listen(id){let c=C.find(x=>x.id==id);if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(c.e);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
today();
</script></body></html>
