function nextQuestion(){quiz.i++;quizDraw()}
function weak(){let a=C.filter(c=>S.ng[c.id]).sort((x,y)=>(S.ng[y.id]||0)-(S.ng[x.id]||0)).slice(0,20);screenEl.innerHTML='<div class="card"><div class="label">WEAK CHUNKS</div><div class="small">テストで間違えたものを優先表示。</div></div>'+(a.length?a.map(c=>'<div class="row"><b>'+esc(c.p)+'</b><br><span class="small">'+esc(c.m)+' ｜ ミス '+S.ng[c.id]+'回</span></div>').join(""):'<div class="card small">まだテスト履歴がありません。</div>')}
function listenMenu(){let c=C[Math.floor(Math.random()*C.length)];screenEl.innerHTML='<div class="card"><div class="label">LISTENING</div><div class="chunk">'+esc(c.p)+'</div><div class="jp">'+esc(c.m)+'</div><button class="btn" style="width:100%;margin-top:12px" onclick="listen('+c.id+')">🔊 再生</button><div class="small" style="margin-top:12px">音声は自動再生しません。聞きたいときだけ押してください。</div></div><button class="btn light" style="width:100%" onclick="listenMenu()">別のチャンク</button>'}
function status(){let seen=Object.keys(S.seen||{}).length, mastered=C.filter(c=>(S.ok[c.id]||0)>=3&&(S.ng[c.id]||0)===0).length;screenEl.innerHTML='<div class="card"><div class="label">LEARNING STATUS</div><div class="chunk">'+seen+' / '+C.length+'</div><div class="jp">学習したチャンク</div><div class="ex">テスト回答数：'+S.total+'<br>正答率：'+(S.total?Math.round(S.correct/S.total*100):0)+'%<br>3回以上正解・ミスなし：'+mastered+'<br>苦手チャンク：'+C.filter(c=>S.ng[c.id]).length+'</div></div><div class="card small">「今日」は未学習→苦手→復習期限が来たチャンクを優先します。</div>'}
function resetStats(){if(confirm("学習履歴をリセットしますか？")){localStorage.removeItem("ect");location.reload()}}
function listen(id){let c=C.find(x=>x.id==id);if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(c.e);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
today();
</script></body></html>
